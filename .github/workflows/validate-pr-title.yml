name: Validate PR title

on:
  pull_request:
    # `edited` re-runs when a title is corrected — the PR title is the
    # release-please bump signal (R-380), so a stale pass on an old title
    # would be unsafe.
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    uses: rheged-studio/shared-workflows/.github/workflows/reusable-validate-pr-title.yml@v1
    secrets: inherit
