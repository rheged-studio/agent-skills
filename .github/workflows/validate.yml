name: Validate

on:
  pull_request:
    # `edited` is included so the changelog-completeness gate re-runs when a
    # title is corrected — the PR title is the release-please bump signal
    # (SK-380), so a stale pass on an old title would be unsafe. (The
    # Conventional-Commit title lint lives in its own validate-pr-title.yml.)
    # The default set is opened/synchronize/reopened.
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A-1100 / A-1195: never cancel a RUNNING run. A superseded run's `needs` all
  # report `cancelled`, the always() aggregator still executes, and its verdict
  # mints a FALSE RED `GO/NO GO`. With `false`, concurrency can only cancel a
  # *pending* run (no check-runs minted). Subsumes the A-961 release-please
  # carve-out — covers every branch, not just the release one.
  cancel-in-progress: false

# Defence-in-depth (ASW-313): the repo default is already read-only, but
# pin it here so a future org-policy change can't silently widen CI's token.
permissions:
  contents: read

# Wave 3 consumer (A-589 / A-594): the static lint/build/test checks run through
# the estate's shared reusable workflows, pinned to the floating `@v1` major tag
# (A-672 / A-662) — `move-floating-major.yml` in shared-workflows keeps `v1` on
# each release commit, so we ride the latest v1.x fixes without a Dependabot SHA
# bump. The `lint` caller runs ESLint + Markdown + YAML/actionlint; the
# `build-test` caller runs the tsc typecheck + ShellCheck + bats (`build: false`
# — agent-skills ships skills.sh bundles, nothing to compile).
#
# The repo-specific EXECUTION checks stay local in the `skills` job: they need
# `pnpm bootstrap:config` to materialise the gitignored per-skill config.json
# (A-615) first, so they cannot run inside the reusable callers (which have no
# pre-step hook). Vitest is local for the same reason — the composite runs
# `pnpm exec vitest run`, which skips the `pretest` bootstrap hook. The
# `GO/NO GO` aggregator (A-418) is the required status check.
jobs:
  config:
    uses: rheged-studio/shared-workflows/.github/workflows/reusable-load-repo-config.yml@v1
    permissions:
      contents: read

  lint:
    needs: config
    uses: rheged-studio/shared-workflows/.github/workflows/reusable-lint.yml@v1
    with:
      node-version-file: ${{ needs.config.outputs.node_version_file }}
      # Mirror the repo's own `pnpm lint` glob set (the TypeScript infra surface
      # + the .mjs skill helpers). ESLint expands these globs itself.
      eslint-args: infrastructure/scripts/**/*.ts infrastructure/scripts/**/*.mjs infrastructure/tests/**/*.ts tests/**/*.ts lib/**/*.mjs skills/**/*.mjs
      # Mirror .markdownlint-cli2.jsonc so vendored skill bundles and build
      # output stay excluded.
      markdown-globs: |
        **/*.{md,mdx}
        !**/node_modules/**
        !**/dist/**
        !.agents/skills/**
        !.claude/skills/**
      # `validate:changelog` loads the per-skill config at runtime, so it must run
      # after `bootstrap:config` — it stays in the local `skills` job below.
      changelog: false

  build-test:
    needs: config
    uses: rheged-studio/shared-workflows/.github/workflows/reusable-build-test.yml@v1
    with:
      node-version-file: ${{ needs.config.outputs.node_version_file }}
      # agent-skills ships skills.sh bundles — nothing to compile.
      build: false
      # Vitest needs the `pretest` bootstrap hook (skipped by the composite's
      # direct `vitest run`), so it runs in the local `skills` job instead.
      test: false
      shellcheck-paths: "infrastructure/scripts .husky/pre-commit .husky/pre-push .husky/commit-msg"
      # No bats suite — the only .bats tests covered the now-removed publish
      # scripts (centralised in reusable-pkg-release.yml).
      bats: false

  skills:
    name: 🧩 Skills & changelog
    needs: config
    # Deliberately NOT skipped on the release-please branch — the changelog
    # validation + completeness gates must run on the release PR too.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: 0
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.4.0
        with:
          run_install: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ needs.config.outputs.node_version_file }}
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🥾 Bootstrap dogfood config
        # skills/*/config.json is gitignored (A-615) so `skills add --copy` never
        # vendors this repo's own config into consumers. This repo's real values
        # live in infrastructure/dogfood-config/ and are materialised into
        # skills/<name>/config.json here, so the scripts and tests below (which
        # read a real config and fail loudly without one) work.
        run: pnpm bootstrap:config

      - name: 🧪 Unit tests (changelog + send-it helpers)
        run: pnpm test

      - name: 🧪 Skill bundle self-tests
        # Runs each skills/*/scripts/*.mjs shipping a `--self-test` so their
        # offline smoke tests are CI-gated — pnpm test only exercises the
        # exported helpers, not the self-test path.
        run: pnpm test:self

      - name: 📒 Validate changelog entries
        run: pnpm validate:changelog

      - name: 🧩 Validate skill bundle metadata
        # Hard gate (ASW-364): every skills/*/ must have a package.json named
        # @rheged-studio/skill-<dir>, private: true, a semver version, and a
        # SKILL.md whose metadata.version matches.
        run: pnpm validate:skills

      - name: 🧬 Vendor drift-check
        # Drift gate (ADR-0004 / A-534): each bundle's scripts/lib/vendor/ copy
        # must be byte-identical to its canonical lib/*.mjs source.
        run: pnpm vendor:check

      # Changelog-completeness gate (SK-380): a release-triggering PR title
      # (feat/fix/breaking) must carry a dated changelog/ entry. Non-release
      # titles — including the release-please PR's own `chore: release …` — pass.
      - name: 📓 Changelog completeness
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changelog-core check-completeness

  skill-manifests:
    name: 🧪 Validate skill manifests
    # Skipped on the release-please branch for consistency: the orchestrator's
    # release PRs don't touch skills/, so there's nothing new to validate there.
    # Still a hard gate on feature PRs that add/change a skill.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: 🥾 Bootstrap dogfood config
        # skills/*/config.json is gitignored (A-615); the self-tests below run
        # scripts that load a real config at import (e.g. changelog/add-links.mjs),
        # so materialise this repo's own configs from infrastructure/dogfood-config/
        # first. Zero-dependency Node — no install needed.
        run: node infrastructure/scripts/bootstrap-config.mjs

      - name: 🧪 Validate SKILL.md manifests
        # Hard gate: every skills/<name>/ with a SKILL.md must pass the canonical
        # Agent Skills validator. A malformed manifest fails the PR.
        run: |
          shopt -s nullglob
          found=0
          for dir in skills/*/; do
            [ -f "${dir}SKILL.md" ] || continue
            found=1
            echo "Validating ${dir%/}"
            npx --yes skills-ref@0.1.5 validate "./${dir%/}"
          done
          if [ "$found" -eq 0 ]; then
            echo "No skills with a SKILL.md found — nothing to validate."
          fi

      - name: 🧪 Run skill self-tests
        # Hard gate: any skills/*/scripts/*.mjs shipping a `--self-test` is
        # exercised here, so a script regression can't ship green. Discovery is
        # grep-based, so new self-testing scripts are picked up automatically.
        run: |
          shopt -s nullglob
          found=0
          for script in skills/*/scripts/*.mjs; do
            grep -q -- '--self-test' "$script" || continue
            found=1
            echo "::group::self-test ${script}"
            node "$script" --self-test
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No skill self-tests found — nothing to run."
          fi

  go-no-go:
    name: GO/NO GO
    needs: [config, lint, build-test, skills, skill-manifests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⚖️ Verdict
        # Pass/fail by inspecting the `needs` results (A-1103 / A-1195). `skipped`
        # is allowlisted only on `release-please--*` branches (path-skipped jobs);
        # everywhere else every needed job must report `success`. `failure`,
        # `cancelled` and a null/empty result fail the gate.
        #
        # `cancelled` is deliberately NOT allowlisted (A-1100). NEVER reach for
        # `if: !cancelled()` on this job — a skipped check-run counts as SUCCESS
        # for required status checks and would forge the gate.
        env:
          # Read through `env:`, never interpolate into the shell body: job
          # names reach this context from the workflow and would otherwise be a
          # template-injection surface.
          NEEDS_JSON: ${{ toJSON(needs) }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Allow `skipped` only on release-please path-skips; otherwise every
          # needed job must have succeeded (A-1103).
          if [[ "$HEAD_REF" == release-please--* ]]; then
            ALLOWED='["success","skipped"]'
          else
            ALLOWED='["success"]'
          fi
          echo "$NEEDS_JSON" \
            | jq -e --argjson ok "$ALLOWED" \
              'to_entries | all(.value.result as $r | $ok | index($r))' >/dev/null \
            || { echo "::error::a required check failed — refusing to go"; exit 1; }
          echo "All required checks passed — GO."
