name: Package release

on:
  push:
    branches:
      - main
  # No workflow_dispatch (R-326). Re-run a failed release via "Re-run jobs" on
  # the original push run.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Defence-in-depth: deny default token permissions; each job declares only what
# it needs (R-313).
permissions: {}

jobs:
  config:
    uses: rheged-studio/shared-workflows/.github/workflows/reusable-load-repo-config.yml@v1
    permissions:
      contents: read

  release:
    needs: config
    uses: rheged-studio/shared-workflows/.github/workflows/reusable-pkg-release.yml@v1
    with:
      npm-scope: ${{ needs.config.outputs.npm_scope }}
      # Bundle-only package (ships skills.sh bundles) — no build script, so skip
      # the verification build (R-624).
      build: false
    permissions:
      # Required by the reusable release workflow to create releases and tags.
      contents: write
      # Required for npm trusted publishing / provenance.
      id-token: write
      # Required by release automation for release notes/issues integration.
      issues: write
      # Required for GitHub Packages publication.
      packages: write
      # Required for artifact attestations.
      attestations: write

  # Post-merge changelog enrich / finalise via changelog-core (R-797 / R-821).
  # The write-back bot/App identity comes from infrastructure/repo-config.yaml
  # via the config job (R-1927 / R-1953); secrets: inherit passes
  # ROADRUNNER_PRIVATE_KEY for the App-token mint. Runs independently of
  # `release` — both read the bumped version from the committed package.json;
  # no publish artifact is needed.
  changelog-enrich:
    needs: config
    uses: rheged-studio/shared-workflows/.github/workflows/reusable-changelog-enrich.yml@v1
    with:
      mode: finalise
      app-client-id: ${{ needs.config.outputs.app_client_id }}
      bot-name: ${{ needs.config.outputs.bot_name }}
      bot-email: ${{ needs.config.outputs.bot_email }}
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit
